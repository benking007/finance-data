<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员登录 · 金融数据台</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/admin-login.js" defer></script>
</head>
<body>
  <header class="site-navigation">
    <a href="/" class="brand" aria-label="金融数据台首页">
      <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>金融数据台</span>
    </a>
    <nav aria-label="主导航">
      <a class="nav-item" href="/">数据目录</a>
      <a class="nav-item" href="/operations" aria-current="page">数据运营</a>
      <a class="nav-item" href="/docs">API 文档</a>
    </nav>
  </header>
  <main class="admin-login">
    <header class="page-header"><div><h1>管理员登录</h1><p>验证管理员密码后进入数据运营后台。</p></div></header>
    <section class="panel key-panel">
      <form id="admin-login-form" method="post" autocomplete="off">
        <label for="admin-password">管理员密码</label>
        <input type="password" id="admin-password" autocomplete="current-password" required autofocus>
        <button type="submit" class="primary" id="admin-login-submit">登录</button>
        <p id="admin-login-status" class="feedback" role="status"></p>
      </form>
    </section>
  </main>
</body>
</html>
